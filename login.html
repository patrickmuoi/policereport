<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đăng nhập · Soft UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e4e9f1;
      --text: #2d3748;
      --text-muted: #64748b;
      --accent: #4b6cf0;
      --shadow-light: #ffffff;
      --shadow-dark: #bcc4d3;
      --error: #e53e3e;
      --success: #10b981;

      --raised-card: 14px 14px 28px var(--shadow-dark), -14px -14px 28px var(--shadow-light);
      --raised-btn: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
      --raised-sm: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
      --sunken: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
      --sunken-sm: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      --sunken-pressed: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    }

    [data-theme="dark"] {
      --bg: #2b303b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --shadow-light: #363c49;
      --shadow-dark: #1e2229;
      --accent: #6b88ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
    }

    /* Nút đổi giao diện sáng/tối */
    .theme-toggle-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--raised-btn);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
      z-index: 10;
    }

    .theme-toggle-btn:active {
      box-shadow: var(--sunken-sm);
      transform: scale(0.95);
    }

    /* Thẻ đăng nhập */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg);
      border-radius: 32px;
      box-shadow: var(--raised-card);
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }

    /* 1. Biểu tượng ổ khóa */
    .lock-avatar-outer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--raised-btn);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-avatar-inner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--sunken-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    /* 2. Tiêu đề và dòng phụ */
    .header-text {
      text-align: center;
      margin-bottom: 26px;
    }

    .header-text h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .header-text p {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Form và các trường nhập liệu */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 18px;
      box-shadow: var(--sunken);
      padding: 0 14px;
      height: 50px;
      transition: box-shadow 0.2s ease, outline 0.2s ease;
    }

    .input-wrapper:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .input-wrapper.has-error {
      outline: 2px solid var(--error);
      outline-offset: 1px;
    }

    .input-icon {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 10px;
    }

    .input-field {
      flex: 1;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .input-field::placeholder {
      color: var(--text-muted);
      opacity: 0.65;
    }

    /* Nút tròn ẩn/hiện mật khẩu */
    .toggle-pwd-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: var(--bg);
      color: var(--text-muted);
      box-shadow: var(--raised-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }

    .toggle-pwd-btn:active,
    .toggle-pwd-btn[aria-pressed="true"] {
      box-shadow: var(--sunken-sm);
      color: var(--accent);
    }

    .error-text {
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
      padding-left: 6px;
      display: none;
    }

    .error-text.show {
      display: block;
    }

    /* 4. Hàng Ghi nhớ tôi & Quên mật khẩu */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    .remember-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    /* Công tắc neumorphic */
    .switch-track {
      width: 44px;
      height: 24px;
      border-radius: 14px;
      background: var(--bg);
      box-shadow: var(--sunken-sm);
      display: flex;
      align-items: center;
      padding: 3px;
      transition: background-color 0.25s ease;
      flex-shrink: 0;
    }

    .switch-knob {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, box-shadow 0.25s ease;
    }

    .remember-input:checked + .switch-track .switch-knob {
      transform: translateX(20px);
      background: var(--accent);
      box-shadow: 2px 2px 5px var(--shadow-dark), -1px -1px 3px rgba(255, 255, 255, 0.3);
    }

    .remember-input:focus-visible + .switch-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .forgot-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* 5. Nút Đăng nhập to, nổi */
    .submit-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 20px;
      background: var(--bg);
      color: var(--accent);
      font-size: 15.5px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: var(--raised-btn);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease, color 0.2s ease;
      margin-bottom: 24px;
    }

    .submit-btn:active,
    .submit-btn.sunken {
      box-shadow: var(--sunken-pressed);
      transform: translateY(1px);
    }

    .submit-btn.success {
      color: var(--success);
    }

    .submit-btn:disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    /* 6. Đường phân cách và nút mạng xã hội */
    .divider {
      position: relative;
      text-align: center;
      margin-bottom: 22px;
    }

    .divider-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      box-shadow: var(--sunken-sm);
      transform: translateY(-50%);
    }

    .divider-text {
      position: relative;
      display: inline-block;
      padding: 0 12px;
      background: var(--bg);
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 26px;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--raised-btn);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }

    .social-btn:hover {
      color: var(--accent);
    }

    .social-btn:active {
      box-shadow: var(--sunken-sm);
      transform: scale(0.94);
    }

    /* 7. Dòng đăng ký cuối */
    .signup-text {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .signup-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* Tiêu chuẩn Focus-visible */
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Giảm chuyển động khi người dùng yêu cầu */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Nút chuyển đổi giao diện Sáng / Tối -->
  <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Chuyển chế độ sáng tối">
    <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- Icon mặc định mặt trăng -->
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="login-card">

    <!-- 1. Biểu tượng ổ khóa vòng tròn nổi và lõm -->
    <div class="lock-avatar-outer" aria-hidden="true">
      <div class="lock-avatar-inner">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
    </div>

    <!-- 2. Tiêu đề và phụ đề -->
    <header class="header-text">
      <h1>Chào mừng trở lại</h1>
      <p>Đăng nhập để tiếp tục</p>
    </header>

    <!-- Form đăng nhập -->
    <form id="loginForm" novalidate>

      <!-- 3. Ô Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <div class="input-wrapper" id="emailWrapper">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input type="email" id="email" name="email" class="input-field" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="error-text" id="emailError" role="alert"></div>
      </div>

      <!-- 3. Ô Mật khẩu -->
      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu</label>
        <div class="input-wrapper" id="passwordWrapper">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7.5" cy="15.5" r="4.5"></circle>
              <path d="m21 4-9.5 9.5"></path>
              <path d="m15.5 7.5 3 3"></path>
            </svg>
          </span>
          <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-pwd-btn" id="togglePwdBtn" aria-label="Hiện mật khẩu" aria-pressed="false">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="error-text" id="passwordError" role="alert"></div>
      </div>

      <!-- 4. Ghi nhớ tôi & Quên mật khẩu -->
      <div class="options-row">
        <label class="remember-wrapper">
          <input type="checkbox" id="rememberMe" name="remember" class="remember-input">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-knob"></span>
          </span>
          <span>Ghi nhớ tôi</span>
        </label>
        <a href="#forgot" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <!-- 5. Nút Đăng nhập -->
      <button type="submit" class="submit-btn" id="submitBtn">Đăng nhập</button>

    </form>

    <!-- 6. Đường phân cách và nút mạng xã hội -->
    <div class="divider" aria-hidden="true">
      <div class="divider-line"></div>
      <span class="divider-text">hoặc tiếp tục với</span>
    </div>

    <div class="social-row">
      <!-- Google -->
      <button type="button" class="social-btn" aria-label="Đăng nhập bằng Google">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
      </button>

      <!-- Apple -->
      <button type="button" class="social-btn" aria-label="Đăng nhập bằng Apple">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 1.01-2.87-.96.04-2.12.64-2.79 1.43-.59.68-1.1 1.77-1.03 2.81 1.07.08 2.19-.57 2.81-1.37z"></path>
        </svg>
      </button>

      <!-- GitHub -->
      <button type="button" class="social-btn" aria-label="Đăng nhập bằng GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
        </svg>
      </button>
    </div>

    <!-- 7. Dòng đăng ký cuối -->
    <div class="signup-text">
      Chưa có tài khoản? <a href="#register">Đăng ký</a>
    </div>

  </main>

  <script>
    // --- Quản lý Chế độ Giao diện (Sáng / Tối) ---
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const root = document.documentElement;

    const sunIconSvg = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
    const moonIconSvg = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;

    function applyTheme(theme) {
      if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
        themeIcon.innerHTML = sunIconSvg;
        themeToggle.setAttribute('aria-label', 'Chuyển sang chế độ sáng');
      } else {
        root.removeAttribute('data-theme');
        themeIcon.innerHTML = moonIconSvg;
        themeToggle.setAttribute('aria-label', 'Chuyển sang chế độ tối');
      }
    }

    // Khởi tạo theo localStorage hoặc hệ thống
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
    applyTheme(initialTheme);

    themeToggle.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      applyTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });

    // Lắng nghe thay đổi theme từ hệ thống nếu chưa từng lưu
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('theme')) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });

    // --- Ẩn / Hiện Mật khẩu ---
    const passwordInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('togglePwdBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    const eyeOpenSvg = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    const eyeSlashSvg = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

    togglePwdBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      if (isPassword) {
        passwordInput.setAttribute('type', 'text');
        togglePwdBtn.setAttribute('aria-label', 'Ẩn mật khẩu');
        togglePwdBtn.setAttribute('aria-pressed', 'true');
        eyeIcon.innerHTML = eyeSlashSvg;
      } else {
        passwordInput.setAttribute('type', 'password');
        togglePwdBtn.setAttribute('aria-label', 'Hiện mật khẩu');
        togglePwdBtn.setAttribute('aria-pressed', 'false');
        eyeIcon.innerHTML = eyeOpenSvg;
      }
      passwordInput.focus();
    });

    // --- Kiểm tra biểu mẫu (Validation) & Xử lý Gửi Form ---
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const emailWrapper = document.getElementById('emailWrapper');
    const emailError = document.getElementById('emailError');

    const passwordWrapper = document.getElementById('passwordWrapper');
    const passwordError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function clearError(wrapper, errorElem) {
      wrapper.classList.remove('has-error');
      errorElem.classList.remove('show');
      errorElem.textContent = '';
    }

    function showError(wrapper, errorElem, message) {
      wrapper.classList.add('has-error');
      errorElem.textContent = message;
      errorElem.classList.add('show');
    }

    // Tự xóa lỗi khi người dùng gõ lại
    emailInput.addEventListener('input', () => {
      if (emailWrapper.classList.contains('has-error')) {
        clearError(emailWrapper, emailError);
      }
    });

    passwordInput.addEventListener('input', () => {
      if (passwordWrapper.classList.contains('has-error')) {
        clearError(passwordWrapper, passwordError);
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const emailVal = emailInput.value.trim();
      const passwordVal = passwordInput.value;
      let isValid = true;

      // Kiểm tra Email
      if (!emailVal) {
        showError(emailWrapper, emailError, 'Vui lòng nhập địa chỉ email.');
        isValid = false;
      } else if (!emailRegex.test(emailVal)) {
        showError(emailWrapper, emailError, 'Email không đúng định dạng.');
        isValid = false;
      } else {
        clearError(emailWrapper, emailError);
      }

      // Kiểm tra Mật khẩu
      if (!passwordVal) {
        showError(passwordWrapper, passwordError, 'Vui lòng nhập mật khẩu.');
        isValid = false;
      } else if (passwordVal.length < 6) {
        showError(passwordWrapper, passwordError, 'Mật khẩu phải có ít nhất 6 ký tự.');
        isValid = false;
      } else {
        clearError(passwordWrapper, passwordError);
      }

      if (!isValid) return;

      // Xử lý trạng thái gửi hợp lệ
      submitBtn.disabled = true;
      submitBtn.classList.add('sunken');
      submitBtn.textContent = 'Đang đăng nhập…';

      setTimeout(() => {
        submitBtn.classList.add('success');
        submitBtn.textContent = 'Đăng nhập thành công';

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.classList.remove('sunken', 'success');
          submitBtn.textContent = 'Đăng nhập';
        }, 1500);
      }, 1000);
    });
  </script>
</body>
</html>
