window.onTurnstileLoad=()=>renderTurnstile();
function renderTurnstile(){
 const el=$('#cf-turnstile-container');
 if(!el)return;
 if(location.protocol==='file:'){
  el.innerHTML='<div style="background:#fff4f2;border:1px solid #fecaca;color:#991b1b;padding:8px 10px;border-radius:4px;font-size:12px;text-align:center">💡 <b>Chế độ offline (file://):</b> CAPTCHA tự động bỏ qua khi mở trực tiếp từ máy tính.</div>';
  turnstileToken='file-local-token';
  return;
 }
 if(!window.turnstile)return;
 turnstileToken='';
 try{
  el.innerHTML='';
  turnstileWidgetId=window.turnstile.render(el,{
   sitekey:CF_SITE_KEY,
   theme:'light',
   callback:token=>{turnstileToken=token;$('#cf-turnstile-err')?.remove()},
   'expired-callback':()=>{turnstileToken=''},
   'error-callback':code=>{
    turnstileToken='';
    console.error('Turnstile error code:',code);
    let msg='Lỗi xác minh CAPTCHA ('+code+').';
    if(code=='110200'){
     msg='⚠️ <b>Lỗi tên miền (110200):</b> Tên miền <code>'+location.hostname+'</code> chưa được thêm vào mục <b>Domains</b> của widget trong Cloudflare Dashboard.';
    } else if(code=='110600'){
     msg='⚠️ <b>Lỗi hết hạn (110600):</b> Thời gian trên máy tính bị lệch hoặc tải quá lâu. Vui lòng thử lại.';
    }
    let errBox=$('#cf-turnstile-err');
    if(!errBox){
     errBox=document.createElement('div');
     errBox.id='cf-turnstile-err';
     errBox.style='color:#b3261e;font-size:12px;margin-top:6px;line-height:1.4;text-align:center;background:#fff5f5;padding:6px 10px;border-radius:4px;border:1px solid #fed7d7';
     el.parentNode.insertBefore(errBox,el.nextSibling);
    }
    errBox.innerHTML=msg;
   }
  });
 }catch(err){console.warn('Turnstile render err:',err)}
}

function getSbConfig(){
  if(window.ENV_SUPABASE_CONFIG&&window.ENV_SUPABASE_CONFIG.url&&window.ENV_SUPABASE_CONFIG.anonKey)return window.ENV_SUPABASE_CONFIG;
  if(window.SUPABASE_CONFIG&&window.SUPABASE_CONFIG.url&&window.SUPABASE_CONFIG.anonKey)return window.SUPABASE_CONFIG;
  try{const s=JSON.parse(localStorage.getItem('sb_config'));if(s&&s.url&&s.anonKey)return s}catch(e){}
  return null;
}

async function initSupabase(){
  const cfg=getSbConfig();
  if(!cfg||!cfg.url||!cfg.anonKey){sbClient=null;return false}
  try{
    if(!window.supabase||!window.supabase.createClient)return false;
    sbClient=window.supabase.createClient(cfg.url,cfg.anonKey);
    return await syncAllFromSupabase();
  }catch(err){
    console.error('Supabase init error:',err);
    return false;
  }
}

async function syncAllFromSupabase(){
  if(!sbClient)return false;
  try{
    const {data:dData,error:dErr}=await sbClient.from('departments').select('*');
    if(!dErr&&dData&&dData.length){
      dData.forEach(d=>{
        if(!db.depts[d.dept])db.depts[d.dept]=mkD(d.name,d.color);
        else{db.depts[d.dept].name=d.name;db.depts[d.dept].color=d.color}
        if(d.logo)db.depts[d.dept].logo=d.logo;
        if(d.stamp)db.depts[d.dept].stamp=d.stamp;
      });
    }

    const {data:oData,error:oErr}=await sbClient.from('officers').select('*');
    if(!oErr&&oData&&oData.length){
      db.officers=oData.map(o=>({id:o.id,dept:o.dept,user:o.username,pass:o.password,name:o.name,rank:o.rank,badge:o.badge,role:o.role}));
    }

    const {data:cData,error:cErr}=await sbClient.from('cases').select('*').order('created_at',{ascending:true});
    if(!cErr&&cData&&cData.length){
      db.cases=cData.map(r=>({
        id:r.id,dept:r.dept,no:r.no,f:r.f||{},officers:r.officers||[],suspects:r.suspects||[],
        victims:r.victims||[],witnesses:r.witnesses||[],vehicles:r.vehicles||[],evidence:r.evidence||[],
        photos:r.photos||[],narr:r.narr||'',lh:r.lh||'1.5',sig:r.sig||'',
        byName:r.by_name||(r.f&&r.f.byName)||'',byRank:r.by_rank||(r.f&&r.f.byRank)||'',byBadge:r.by_badge||(r.f&&r.f.byBadge)||'',
        created:r.created||r.created_at
      }));
    }

    const {data:wData,error:wErr}=await sbClient.from('warrants').select('*').order('created_at',{ascending:true});
    if(!wErr&&wData&&wData.length){
      db.warrants=wData.map(w=>({
        id:w.id,dept:w.dept,no:w.no,type:w.type,citizen:w.citizen||'',dob:w.dob||'',citizenId:w.citizen_id||'',
        citizenAddress:w.citizen_address||'',location:w.location||'',caseNo:w.case_no||'',reason:w.reason||'',
        items:w.items||'',requestedBy:w.requested_by||'',requestedRank:w.requested_rank||'',status:w.status||'pending',
        approvedBy:w.approved_by||'',approvedRank:w.approved_rank||'',approvedAt:w.approved_at||'',createdAt:w.created_at||''
      }));
    }

    save();
    render();
    return true;
  }catch(err){
    console.error('Supabase fetch error:',err);
    return false;
  }
}

async function syncCaseToSupabase(c){
  if(!sbClient)return;
  try{
    const row={
      id:c.id,dept:c.dept,no:c.no,title:(c.f&&c.f.title)||'',type:(c.f&&c.f.type)||'',status:(c.f&&c.f.status)||'',
      f:c.f||{},officers:c.officers||[],suspects:c.suspects||[],victims:c.victims||[],witnesses:c.witnesses||[],
      vehicles:c.vehicles||[],evidence:c.evidence||[],photos:c.photos||[],narr:c.narr||'',lh:c.lh||'1.5',sig:c.sig||'',
      by_name:c.byName||'',by_rank:c.byRank||'',by_badge:c.byBadge||'',created:c.created||new Date().toISOString()
    };
    const {error}=await sbClient.from('cases').upsert(row,{onConflict:'id'});
    if(error){console.error(error);toast('Lỗi Supabase: '+error.message)}
    else toast('Đã đồng bộ hồ sơ lên Supabase');
  }catch(e){console.error(e)}
}

}

function ex(cmd,val){const ed=$('#ed');ed.focus();if(sel){const s=getSelection();s.removeAllRanges();s.addRange(sel)}document.execCommand('styleWithCSS',false,true);
 if(cmd=='hr')document.execCommand('insertHTML',false,`<hr style="border:0;border-top:2px solid ${$('[data-col=foreColor]').value}"><p><br></p>`);else document.execCommand(cmd,false,val);draft.narr=ed.innerHTML}
document.addEventListener('selectionchange',()=>{const ed=$('#ed'),s=getSelection();if(ed&&s.rangeCount&&ed.contains(s.anchorNode))sel=s.getRangeAt(0).cloneRange()});
document.addEventListener('mousedown',e=>{if(e.target.closest('.tb button'))e.preventDefault()});

document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target;
 if(f.id=='lf'){
  const u=f.u.value.trim(),p=f.p.value;
  if(!turnstileToken){
    return toast('Vui lòng hoàn thành xác minh Cloudflare CAPTCHA');
  }
  if(turnstileToken!=='file-local-token' && location.protocol!=='file:'){
    try{
      const vRes=await fetch('/api/verify-turnstile',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:turnstileToken})
      });
      if(vRes.ok){
        const vData=await vRes.json();
        if(!vData.success){
          renderTurnstile();
          return toast('Xác minh CAPTCHA không hợp lệ, vui lòng thử lại');
        }
      }
    }catch(err){
      console.warn('Turnstile verify error:',err);
    }
  }
  let o=db.officers.find(o=>o.dept==LD&&o.user==u&&o.pass==p);
  if(!o&&sbClient){
    try{
      const {data}=await sbClient.from('officers').select('*').eq('dept',LD).eq('username',u).eq('password',p).maybeSingle();
      if(data){
        o={id:data.id,dept:data.dept,user:data.username,pass:data.password,name:data.name,rank:data.rank,badge:data.badge,role:data.role};
        if(!db.officers.some(x=>x.id==o.id))db.officers.push(o);
        save();
      }
    }catch(err){console.error(err)}
  }
  if(!o){
    renderTurnstile();
    return toast('Sai tài khoản, mật khẩu hoặc sai sở');
  }
  turnstileToken='';
  me=o;view='dash';render();
 }
 else if(f.id=='wf'){
  const d=Object.fromEntries(new FormData(f)),n=deptWarrants().length+1;
  const w={id:'w'+Date.now(),dept:me.dept,no:`${me.dept}-W-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`,type:d.type,citizen:d.citizen.trim(),dob:d.dob,citizenId:d.citizenId.trim(),citizenAddress:d.citizenAddress.trim(),location:d.location.trim(),caseNo:d.caseNo.trim(),reason:d.reason.trim(),items:d.items.trim(),requestedBy:me.name,requestedRank:me.rank,status:'pending',createdAt:new Date().toISOString(),approvedBy:'',approvedRank:'',approvedAt:''};
  db.warrants.push(w);activeWarrantId=w.id;save();view='warrants';render();toast('Đã gửi yêu cầu, chờ quản trị viên phê duyệt');
  syncWarrantToSupabase(w);
 }
 else if(f.id=='of'){
  const d=Object.fromEntries(new FormData(f));
  if(db.officers.some(o=>o.user==d.user))return toast('Tên đăng nhập đã tồn tại');
  const newOff={id:'o'+Date.now(),dept:me.dept,...d};
  db.officers.push(newOff);save();render();toast('Đã thêm sĩ quan');
  syncOfficerToSupabase(newOff);
 }
});

document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.f){F[d.f]=t.value;list()}
 else if(d.s){if(d.s=='c')draft[d.k]=t.value;else if(d.s=='f')draft.f[d.k]=t.value;else draft[d.s][d.i][d.k]=t.value}
 else if(d.ci)draft.photos[d.ci].cap=t.value;else if(d.col)ex(d.col,t.value);else if(t.id=='ed')draft.narr=t.innerHTML});

document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.f){F[d.f]=t.value;list()}
 if(d.fs&&t.value)ex('fontSize',t.value);
 if(d.lh&&t.value){$('#ed').style.lineHeight=t.value;draft.lh=t.value}
 if(d.s=='officers'&&d.k=='name'){const o=db.officers.find(o=>o.dept==draft.dept&&o.name==t.value);if(o){Object.assign(draft.officers[d.i],{rank:o.rank,badge:o.badge});keep();render()}}
 if(t.id=='fi')[...t.files].forEach(f=>rs(f,1000,'image/jpeg',src=>{keep();draft.photos.push({src,cap:''});render()}));
 if(t.id=='lg'&&t.files[0])rs(t.files[0],320,'image/png',src=>{db.depts[me.dept].logo=src;save();render();syncDeptToSupabase(me.dept)});
 if(t.id=='sp'&&t.files[0])rs(t.files[0],320,'image/png',src=>{db.depts[me.dept].stamp=src;save();render();syncDeptToSupabase(me.dept)})});

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c)return ex(b.dataset.c);
 const a=b.dataset.a,v=b.dataset.v;if(!a)return;
 if(a=='dept'){LD=v;render()}
 else if(a=='out'){me=null;render()}
 else if(a=='go'){view=v;if(v=='new')draft=blank();render()}
 else if(a=='view'){cur=db.cases.find(c=>c.id==v);view='view';render()}
 else if(a=='showWarrant'){activeWarrantId=v;render()}
 else if(a=='approveWarrant'){
  const w=db.warrants.find(x=>x.id==v&&x.dept==me.dept);
  if(me.role!='admin')return toast('Chỉ quản trị viên mới có thể phê duyệt');
  if(w&&w.status!='approved'){
    w.status='approved';w.approvedBy=me.name;w.approvedRank=me.rank;w.approvedAt=new Date().toISOString();
    activeWarrantId=w.id;save();render();toast('Đã phê duyệt lệnh role-play');
    syncWarrantToSupabase(w);
  }
 }
 else if(a=='exportWarrant'){exportWarrantImage(v)}
 else if(a=='edit'){
  if(me.role!='admin')return toast('Chỉ người có thẩm quyền mới được sửa hồ sơ');
  const c=db.cases.find(c=>c.id==v&&c.dept==me.dept);
  if(!c)return toast('Không tìm thấy hồ sơ');
  draft=JSON.parse(JSON.stringify(c));view='edit';render();
 }
 else if(a=='del'){
  if(me.role!='admin')return toast('Chỉ người có thẩm quyền mới được xóa hồ sơ');
  if(confirm('Xóa hồ sơ này?')){
    db.cases=db.cases.filter(c=>c.id!=v||c.dept!=me.dept);
    save();render();
    deleteCaseFromSupabase(v);
  }
 }
 else if(a=='print'){try{window.print()}catch(x){toast('Hãy mở trang ở tab mới rồi bấm Ctrl+P')}}
 else if(a=='add'){keep();draft[v].push({});render()}
 else if(a=='rm'){keep();const[s,i]=v.split(':');draft[s].splice(i,1);render()}
 else if(a=='delph'){keep();draft.photos.splice(v,1);render()}
 else if(a=='deloff'){
  if(confirm('Xóa sĩ quan?')){
    db.officers=db.officers.filter(o=>o.id!=v);
    save();render();
    deleteOfficerFromSupabase(v);
  }
 }
 else if(a=='rmlogo'){db.depts[me.dept].logo='';save();render();syncDeptToSupabase(me.dept)}
 else if(a=='rmstamp'){db.depts[me.dept].stamp='';save();render();syncDeptToSupabase(me.dept)}
 else if(a=='save'){
  if(draft.id&&me.role!='admin')return toast('Chỉ người có thẩm quyền mới được sửa hồ sơ');
  keep();if(!(draft.f.title||'').trim()||!(draft.f.loc||'').trim())return toast('Cần nhập Tiêu đề vụ việc và Địa điểm');
  if(draft.id)db.cases=db.cases.map(c=>c.id==draft.id?draft:c);
  else{draft.id='c'+Date.now();draft.created=new Date().toISOString();db.cases.push(draft)}
  save();cur=draft;view='view';render();toast('Đã lưu hồ sơ');
  syncCaseToSupabase(draft);
 }
});

const deptWarrants=()=>db.warrants.filter(w=>w.dept==me.dept);
function warrantDocument(w){const D=db.depts[w.dept],fields=[['CÔNG DÂN / ĐỐI TƯỢNG',w.citizen],['Ngày sinh',w.dob],['Số giấy tờ / ID',w.citizenId],['Địa chỉ cư trú',w.citizenAddress],['Địa điểm áp dụng',w.location],['Hồ sơ liên quan',w.caseNo],['Căn cứ / nội dung',w.reason],['TÀI SẢN CẦN TÌM KIẾM',w.items||'Không áp dụng cho lệnh bắt giữ']];return `<section class="warrant-doc"><header class="warrant-head"><small>${esc(D.name)} · ${esc(w.dept)}</small><strong>HỒ SƠ ROLE-PLAY</strong><b>${WARRANT_TYPES[w.type]}</b><span>Mã lệnh: ${esc(w.no)} · ${w.status=='approved'?'ĐÃ PHÊ DUYỆT':'CHỜ PHÊ DUYỆT'}</span><div class="warrant-banner">ROLEPLAY ONLY · KHÔNG CÓ GIÁ TRỊ PHÁP LÝ</div></header><div class="warrant-fields">${fields.map(([label,value])=>`<div class="warrant-field${['Căn cứ / nội dung','Tài sản cần tìm kiếm'].includes(label)?' wide':''}"><small>${label}</small><b>${esc(value||'—')}</b></div>`).join('')}<div class="warrant-field"><small>Người đề nghị</small><b>${esc(w.requestedRank)} ${esc(w.requestedBy)}</b></div><div class="warrant-field"><small>Người phê duyệt</small><b>${esc(w.approvedBy?`${w.approvedRank} ${w.approvedBy}`:'Chưa phê duyệt')}</b></div><div class="warrant-field"><small>Ngày tạo</small><b>${fmt(w.createdAt)}</b></div><div class="warrant-field"><small>Ngày phê duyệt</small><b>${w.approvedAt?fmt(w.approvedAt):'Chưa phê duyệt'}</b></div></div><div class="warrant-sign"><div><small>Người đề nghị</small><br><b>${esc(w.requestedBy)}</b></div><div><small>Người phê duyệt</small><br><b>${esc(w.approvedBy?`${w.approvedRank} ${w.approvedBy}`:'Chưa phê duyệt')}</b></div></div></section>`}
function warrantsV(){const warrants=deptWarrants().slice().reverse(),selected=warrants.find(w=>w.id==activeWarrantId);return `<h1>Lệnh bắt giữ & khám xét</h1><div class="notice"><b>Chế độ role-play.</b> Lệnh tạo ở đây chỉ dùng trong trò chơi, không phải văn bản pháp lý và không trao quyền bắt giữ hoặc khám xét ngoài đời.</div><div class="card"><h2 style="font-size:17px;margin:0 0 12px">Tạo yêu cầu lệnh</h2><form id="wf" class="grid"><label>Loại lệnh<select name="type"><option value="arrest">Lệnh bắt giữ</option><option value="search">Lệnh khám xét</option></select></label><label>Họ tên công dân / đối tượng<input name="citizen" required></label><label>Ngày sinh<input name="dob" type="date"></label><label>Số giấy tờ / ID<input name="citizenId"></label><label>Địa chỉ cư trú<input name="citizenAddress"></label><label>Địa điểm áp dụng<input name="location" required placeholder="Địa chỉ hoặc mô tả địa điểm"></label><label>Hồ sơ liên quan<input name="caseNo" placeholder="Mã hồ sơ nếu có"></label><label style="grid-column:1/-1">Căn cứ / nội dung<textarea name="reason" required placeholder="Mô tả căn cứ theo tình tiết role-play"></textarea></label><label style="grid-column:1/-1">Tài sản cần tìm kiếm (nếu là lệnh khám xét)<textarea name="items" placeholder="Để trống nếu không áp dụng"></textarea></label><button class="p">Gửi phê duyệt</button></form></div><div class="card"><b>Lệnh của ${esc(me.dept)}</b>${warrants.length?`<div style="overflow-x:auto"><table class="tbl"><tr><th>Mã lệnh</th><th>Loại</th><th>Đối tượng</th><th>Trạng thái</th><th></th></tr>${warrants.map(w=>`<tr><td>${esc(w.no)}</td><td>${WARRANT_TYPES[w.type]}</td><td>${esc(w.citizen)}</td><td><span class="tag">${w.status=='approved'?'Đã phê duyệt':'Chờ phê duyệt'}</span>${w.approvedBy?`<small style="display:block">${esc(w.approvedBy)}</small>`:''}</td><td class="warrant-actions"><button data-a="showWarrant" data-v="${esc(w.id)}">Xem</button>${me.role=='admin'&&w.status!='approved'?`<button class="p" data-a="approveWarrant" data-v="${esc(w.id)}">Phê duyệt</button>`:''}${w.status=='approved'?`<button data-a="exportWarrant" data-v="${esc(w.id)}">Tải ảnh PNG</button>`:''}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--mut)">Chưa có yêu cầu lệnh.</p>'}</div>${selected?warrantDocument(selected):''}`}
function exportWarrantImage(id){const w=db.warrants.find(x=>x.id==id&&x.dept==me.dept);if(!w||w.status!='approved')return toast('Chỉ tải ảnh lệnh đã được phê duyệt');const fields=[['CÔNG DÂN / ĐỐI TƯỢNG',w.citizen],['NGÀY SINH',w.dob],['SỐ GIẤY TỜ / ID',w.citizenId],['ĐỊA CHỈ CƯ TRÚ',w.citizenAddress],['ĐỊA ĐIỂM ÁP DỤNG',w.location],['HỒ SƠ LIÊN QUAN',w.caseNo],['CĂN CỨ / NỘI DUNG',w.reason],['TÀI SẢN CẦN TÌM KIẾM',w.items||'Không áp dụng cho lệnh bắt giữ']],canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),width=1240,padding=100,textWidth=width-padding*2;ctx.font='22px Arial';const linesFor=value=>{const words=String(value||'—').split(/\s+/),lines=[];let line='';for(const word of words){const next=(line+' '+word).trim();if(ctx.measureText(next).width>textWidth&&line){lines.push(line);line=word}else line=next}lines.push(line);return lines};const layout=fields.map(([label,value])=>({label,lines:linesFor(value)}));let height=390;for(const item of layout)height+=36+item.lines.length*32+22;height+=210;canvas.width=width;canvas.height=height;ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.strokeStyle='#1c3d7a';ctx.lineWidth=3;ctx.strokeRect(30,30,width-60,height-60);ctx.save();ctx.translate(width/2,height/2);ctx.rotate(-.25);ctx.fillStyle='rgba(179,38,30,.08)';ctx.font='bold 76px Arial';ctx.textAlign='center';ctx.fillText('ROLEPLAY ONLY',0,0);ctx.restore();ctx.textAlign='center';ctx.fillStyle='#b3261e';ctx.font='bold 22px Arial';ctx.fillText('ROLEPLAY ONLY · KHÔNG CÓ GIÁ TRỊ PHÁP LÝ',width/2,80);let y=148;ctx.fillStyle='#475569';ctx.font='22px Arial';ctx.fillText(db.depts[w.dept].name,width/2,y);y+=58;ctx.fillStyle='#1c3d7a';ctx.font='bold 38px Arial';ctx.fillText(WARRANT_TYPES[w.type].toUpperCase(),width/2,y);y+=46;ctx.fillStyle='#111827';ctx.font='bold 22px Arial';ctx.fillText(`MÃ LỆNH: ${w.no} · ĐÃ PHÊ DUYỆT`,width/2,y);y+=48;ctx.textAlign='left';for(const item of layout){y+=30;ctx.fillStyle='#64748b';ctx.font='bold 16px Arial';ctx.fillText(item.label,padding,y);y+=34;ctx.fillStyle='#111827';ctx.font='22px Arial';for(const line of item.lines){ctx.fillText(line,padding,y);y+=32}y+=12}const sigY=y+20;ctx.strokeStyle='#64748b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padding,sigY);ctx.lineTo(500,sigY);ctx.moveTo(740,sigY);ctx.lineTo(width-padding,sigY);ctx.stroke();y=sigY+28;ctx.fillStyle='#111827';ctx.font='17px Arial';ctx.fillText(`Người đề nghị: ${w.requestedRank} ${w.requestedBy}`,padding,y);ctx.fillText(`Người phê duyệt: ${w.approvedRank} ${w.approvedBy}`,740,y);y+=38;ctx.textAlign='center';ctx.fillStyle='#475569';ctx.font='15px Arial';ctx.fillText(`Ngày tạo: ${fmt(w.createdAt)} · Ngày duyệt: ${fmt(w.approvedAt)}`,width/2,y);ctx.fillStyle='#b3261e';ctx.font='bold 18px Arial';ctx.fillText('TÀI LIỆU ROLE-PLAY · KHÔNG DÙNG NGOÀI ĐỜI THẬT',width/2,height-48);canvas.toBlob(blob=>{if(!blob)return toast('Không thể tạo ảnh');const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${w.no.replace(/[^a-z0-9_-]/gi,'-')}.png`;link.click();URL.revokeObjectURL(url)},'image/png')}

render();
initSupabase();
</script>
